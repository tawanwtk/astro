<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f3eee4" />

    <!--
      The masthead is the LCP element and it is set in this face, so the font
      is fetched at the same time as the stylesheet rather than after it.
      Self-hosted: no font CDN, no network call to a third party.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/source-serif-4-latin.woff2"
      crossorigin
    />

    <title>Divergence — where astrological traditions disagree</title>
    <meta
      name="description"
      content="Enter birth data once. See it read through Western tropical and Vedic sidereal astrology side by side, with every point of disagreement marked. Computed entirely in your browser."
    />
    <link rel="canonical" href="https://astrodivergence.pages.dev/" />

    <!-- LinkedIn and most crawlers do not run JS: these must stay in static HTML. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://astrodivergence.pages.dev/" />
    <meta property="og:title" content="Divergence — where astrological traditions disagree" />
    <meta property="og:description" content="Two traditions, one set of birth data, every disagreement marked." />
    <meta property="og:image" content="https://astrodivergence.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
